<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>匿名Q&A</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container app-header-inner">
      <div>
        <h1 id="course-name" class="app-title">読み込み中…</h1>
        <span id="session-meta" class="muted small"></span>
      </div>
      <div class="app-header-actions">
        <span id="conn-status" class="conn-status" hidden>再接続中…</span>
        <button id="sound-toggle" class="btn btn-ghost btn-small sound-toggle" aria-pressed="true" aria-label="通知音の切替">🔔</button>
      </div>
    </div>
  </header>

  <nav class="tabs container" role="tablist" aria-label="コンテンツ切替">
    <button class="tab active" data-tab="questions" role="tab" aria-selected="true">質問</button>
    <button class="tab" data-tab="materials" role="tab" aria-selected="false">参考情報</button>
    <button class="tab" data-tab="surveys" role="tab" aria-selected="false">アンケート</button>
  </nav>

  <main class="container">
    <section id="tab-questions" class="tab-panel">
      <form id="question-form" class="card">
        <label for="question-input" class="sr-only">質問</label>
        <textarea id="question-input" class="textarea" rows="3"
          placeholder="質問を入力(Enter で送信 / Shift+Enter で改行)。画像の貼り付け・ドラッグ&ドロップも可能です"></textarea>
        <div id="image-preview" class="image-preview" hidden>
          <img id="image-preview-img" alt="添付画像プレビュー">
          <button type="button" id="image-remove" class="btn btn-ghost btn-small">添付を取り消す</button>
        </div>
        <div class="form-row">
          <label class="btn btn-ghost file-label">
            画像を添付
            <input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/webp">
          </label>
          <button type="submit" class="btn btn-primary" id="question-submit">質問する</button>
        </div>
        <p id="session-ended-note" class="muted small" hidden>このセッションは終了しています。閲覧のみ可能です。</p>
      </form>

      <div class="list-header">
        <h2>みんなの質問</h2>
        <div class="sort-toggle" role="group" aria-label="並び順">
          <button class="btn btn-ghost btn-small sort-btn active" data-sort="new">新着順</button>
          <button class="btn btn-ghost btn-small sort-btn" data-sort="votes">いいね順</button>
        </div>
      </div>
      <!-- 新着ピル: 他の参加者の新規質問はここに溜め、クリックするまで一覧を動かさない -->
      <div class="new-pill" aria-live="polite">
        <button type="button" id="new-question-pill" hidden>↑ 新しい質問が <span id="new-question-count">0</span> 件</button>
      </div>
      <div id="question-list" class="stack"></div>
      <p id="question-empty" class="muted" hidden>まだ質問はありません。最初の質問を投稿してみましょう。</p>

      <details id="answered-section" class="answered-section" open>
        <summary>回答済みの質問(<span id="answered-count">0</span>)</summary>
        <div id="answered-list" class="stack"></div>
      </details>

      <!-- 無限スクロール用の番兵。画面に入ると次の 50 件を追加取得する -->
      <div id="question-sentinel" aria-hidden="true"></div>
      <p id="question-loading" class="muted small" hidden>読み込み中…</p>
    </section>

    <section id="tab-materials" class="tab-panel" hidden>
      <div id="material-list"></div>
      <p id="material-empty" class="muted" hidden>参考情報はまだ登録されていません。</p>
    </section>

    <section id="tab-surveys" class="tab-panel" hidden>
      <div id="survey-list" class="stack"></div>
      <p id="survey-empty" class="muted" hidden>アンケートはまだ配信されていません。</p>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/session.js"></script>
</body>
</html>
