<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>匿名Q&A - 入室</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/api.js?render=explicit" async defer></script>
</head>
<body>
  <main class="container container-narrow">
    <div class="card enter-card">
      <h1>匿名Q&amp;A</h1>
      <p class="muted small">アクセスコードを入力して入室してください。<br>質問は完全匿名で、誰が投稿したか特定されません。</p>
      <form id="enter-form">
        <label for="code-input">アクセスコード</label>
        <input id="code-input" class="input code-input" autocomplete="off" autocapitalize="characters"
               spellcheck="false" required placeholder="ABC123" maxlength="12">
        <div id="turnstile-widget" class="turnstile-widget"></div>
        <button type="submit" class="btn btn-primary btn-block" id="enter-btn">入室する</button>
        <p id="enter-error" class="error" role="alert" hidden></p>
      </form>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/enter.js"></script>
</body>
</html>
