<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>セッション管理 - 匿名Q&A</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container container-wide app-header-inner">
      <div>
        <h1 id="course-name" class="app-title">読み込み中…</h1>
        <span class="muted small">
          コード: <span id="session-code" class="session-code"></span>
          <button id="copy-url-btn" class="btn btn-ghost btn-small">参加URLをコピー</button>
          <span id="session-status"></span>
        </span>
      </div>
      <div class="actions-inline">
        <span id="conn-status" class="conn-status" hidden>再接続中…</span>
        <button id="sound-toggle" class="btn btn-ghost btn-small sound-toggle" aria-pressed="true" aria-label="通知音の切替">🔔</button>
        <a id="present-link" class="btn btn-ghost btn-small" target="_blank" rel="noopener">投影モード</a>
        <button id="end-session-btn" class="btn btn-ghost btn-small">セッション終了</button>
        <a class="btn btn-ghost btn-small" href="/admin/dashboard">一覧へ</a>
      </div>
    </div>
  </header>

  <nav class="tabs container container-wide" role="tablist" aria-label="管理メニュー">
    <button class="tab active" data-tab="questions" role="tab" aria-selected="true">質問管理</button>
    <button class="tab" data-tab="materials" role="tab" aria-selected="false">参考情報</button>
    <button class="tab" data-tab="surveys" role="tab" aria-selected="false">アンケート</button>
  </nav>

  <main class="container container-wide" style="padding-bottom: 48px;">
    <section id="tab-questions" class="tab-panel">
      <!-- トリアージ(status)・検索・並べ替え。絞り込みはサーバサイドで行う -->
      <div class="admin-toolbar">
        <div class="seg" role="group" aria-label="回答状況で絞り込み">
          <button type="button" class="seg-btn active" data-status="open">未回答 <span class="seg-count" id="count-open">0</span></button>
          <button type="button" class="seg-btn" data-status="done">回答済み <span class="seg-count" id="count-done">0</span></button>
          <button type="button" class="seg-btn" data-status="all">すべて <span class="seg-count" id="count-all">0</span></button>
        </div>
        <div class="search-box">
          <label for="question-search" class="sr-only">質問を検索</label>
          <input type="search" id="question-search" class="input" placeholder="質問を検索(キーワード)" autocomplete="off">
        </div>
        <label for="question-sort" class="sr-only">並び順</label>
        <select id="question-sort" class="select sort-select">
          <option value="votes" selected>いいね順(多い順)</option>
          <option value="new">新着順</option>
          <option value="old">古い順</option>
        </select>
        <button type="button" id="bulk-toggle-btn" class="btn btn-ghost">選択</button>
      </div>

      <!-- 一括モデレーション(選択モード時のみ表示)。確認は画面内 UI で行う -->
      <div class="bulkbar" id="bulkbar" hidden>
        <label><input type="checkbox" id="bulk-select-all" class="bulk-check"> すべて選択</label>
        <span class="muted"><b id="bulk-count">0</b> 件選択中</span>
        <button type="button" id="bulk-delete-btn" class="btn btn-small btn-ghost btn-danger-text">選択したものを一括削除</button>
        <span id="bulk-confirm" hidden>
          <span class="bulk-confirm" id="bulk-confirm-label"></span>
          <button type="button" id="bulk-delete-confirm-btn" class="btn btn-small btn-danger">削除を実行</button>
          <button type="button" id="bulk-delete-cancel-btn" class="btn btn-small btn-ghost">やめる</button>
        </span>
        <button type="button" id="bulk-cancel-btn" class="btn btn-small btn-ghost">キャンセル</button>
      </div>

      <!-- 新着ピル: 新規質問はここに溜め、クリックするまで一覧を動かさない -->
      <div class="new-pill" aria-live="polite">
        <button type="button" id="new-question-pill" hidden>↑ 新しい未回答が <span id="new-question-count">0</span> 件</button>
      </div>

      <!-- 2 ペイン: 左=一覧(密) / 右=詳細 + 回答入力。見出しを対で置き上端を揃える -->
      <div class="two-pane">
        <div class="pane">
          <h2 class="pane-heading" id="list-heading">未回答(いいね順)</h2>
          <div id="question-list" class="qlist"></div>
          <p id="question-empty" class="muted" hidden>該当する質問はありません。</p>

          <!-- 無限スクロール用の番兵。画面に入ると次の 50 件を追加取得する -->
          <div id="question-sentinel" aria-hidden="true"></div>
          <p id="question-loading" class="muted small" hidden>読み込み中…</p>
        </div>
        <div class="pane pane-detail" id="detail-pane">
          <h2 class="pane-heading">選択中の質問</h2>
          <div id="question-detail" class="card detail-card"></div>
        </div>
      </div>
    </section>

    <section id="tab-materials" class="tab-panel" hidden>
      <form id="material-form" class="card">
        <h2>参考情報を追加</h2>
        <div class="form-row" style="margin: 0 0 8px;">
          <input id="material-module" class="input" placeholder="Module(例: Module 1)" style="flex: 1;">
          <input id="material-title" class="input" placeholder="タイトル(必須)" style="flex: 2;" required>
        </div>
        <input id="material-url" class="input" placeholder="URL(任意)" style="margin-bottom: 8px;">
        <textarea id="material-body" class="textarea" rows="2" placeholder="メモ(任意)"></textarea>
        <div class="form-row">
          <span></span>
          <button type="submit" class="btn btn-primary">追加</button>
        </div>
      </form>
      <div id="material-list" class="stack" style="margin-top: 12px;"></div>
      <p id="material-empty" class="muted" hidden>参考情報はまだありません。</p>
    </section>

    <section id="tab-surveys" class="tab-panel" hidden>
      <form id="survey-form" class="card">
        <h2>アンケートを作成</h2>
        <div class="form-row" style="margin: 0 0 8px;">
          <input id="survey-title" class="input" placeholder="質問文(必須)" style="flex: 2;" required>
          <label class="small" style="white-space: nowrap;">
            <input type="checkbox" id="survey-multi"> 複数選択可
          </label>
        </div>
        <textarea id="survey-options" class="textarea" rows="3" placeholder="選択肢(1 行に 1 つ、2 つ以上)" required></textarea>
        <div class="form-row">
          <span></span>
          <button type="submit" class="btn btn-primary">作成(下書き)</button>
        </div>
      </form>
      <div id="survey-list" class="stack" style="margin-top: 12px;"></div>
      <p id="survey-empty" class="muted" hidden>アンケートはまだありません。</p>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin-session.js"></script>
</body>
</html>
