<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード - 匿名Q&A</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container container-wide app-header-inner">
      <h1 class="app-title">匿名Q&A 管理</h1>
      <button id="logout-btn" class="btn btn-ghost btn-small">ログアウト</button>
    </div>
  </header>

  <main class="container container-wide" style="padding-bottom: 48px;">
    <section class="card" style="margin-top: 16px;">
      <h2>セッション作成</h2>
      <form id="create-session-form">
        <div class="form-row" style="align-items: flex-end;">
          <div class="field" style="flex: 2; min-width: 200px; margin: 0;">
            <label for="course-name-input">コース名</label>
            <input id="course-name-input" class="input" required placeholder="例: AWS 入門研修">
          </div>
          <div class="field" style="flex: 1; min-width: 140px; margin: 0;">
            <label for="held-on-input">開催日</label>
            <input id="held-on-input" class="input" type="date">
          </div>
          <div class="field" style="flex: 1; min-width: 160px; margin: 0;">
            <label for="template-select">テンプレート</label>
            <select id="template-select" class="select">
              <option value="">(使用しない)</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">作成</button>
        </div>
        <p id="create-result" class="muted" hidden></p>
      </form>
    </section>

    <section style="margin-top: 24px;">
      <h2>セッション一覧</h2>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>コード</th><th>コース名</th><th>開催日</th><th>状態</th><th>質問数</th><th>削除予定</th><th></th>
            </tr>
          </thead>
          <tbody id="session-rows"></tbody>
        </table>
        <p id="session-empty" class="muted" hidden>セッションはまだありません。</p>
      </div>
    </section>

    <section style="margin-top: 24px;">
      <div class="list-header">
        <h2>テンプレート</h2>
        <button id="new-template-btn" class="btn btn-ghost btn-small">新規テンプレート</button>
      </div>
      <div id="template-list" class="stack"></div>
      <p id="template-empty" class="muted" hidden>テンプレートはまだありません。</p>

      <form id="template-editor" class="card hidden" style="margin-top: 12px;">
        <h3 id="template-editor-title">新規テンプレート</h3>
        <div class="field">
          <label for="template-name-input">テンプレート名</label>
          <input id="template-name-input" class="input" required placeholder="例: AWS 入門研修セット">
        </div>
        <h3>参考情報</h3>
        <div id="template-materials"></div>
        <button type="button" id="add-material-row" class="btn btn-ghost btn-small">+ 参考情報を追加</button>
        <h3 style="margin-top: 16px;">アンケート</h3>
        <div id="template-surveys"></div>
        <button type="button" id="add-survey-row" class="btn btn-ghost btn-small">+ アンケートを追加</button>
        <div class="admin-item-actions" style="margin-top: 16px;">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" id="cancel-template" class="btn btn-ghost">キャンセル</button>
        </div>
        <p id="template-error" class="error" hidden></p>
      </form>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin-dashboard.js"></script>
</body>
</html>
