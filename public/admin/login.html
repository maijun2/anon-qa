<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>講師ログイン - 匿名Q&A</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container container-narrow">
    <div class="card enter-card">
      <h1>講師ログイン</h1>
      <form id="login-form">
        <label for="password-input">パスワード</label>
        <input id="password-input" class="input" type="password" autocomplete="current-password" required>
        <div style="margin-top: 12px;">
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">ログイン</button>
        </div>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
    </div>
  </main>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
