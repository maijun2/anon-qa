<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>講師ログイン - 匿名Q&A</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container container-narrow">
    <div class="card enter-card">
      <h1>講師ログイン</h1>
      <form id="login-form">
        <label for="password-input">パスワード</label>
        <input id="password-input" class="input" type="password" autocomplete="current-password" required>
        <div style="margin-top: 12px;">
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">ログイン</button>
        </div>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
    </div>
  </main>
  <script src="/js/admin-common.js"></script>
  <script>
    (async () => {
      // ログイン済みならダッシュボードへ(素の fetch で 401 リダイレクトループを回避)
      const me = await fetch("/api/admin/me").catch(() => null);
      if (me && me.ok) {
        location.href = "/admin/dashboard";
        return;
      }

      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      document.getElementById("login-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        errorEl.hidden = true;
        btn.disabled = true;
        try {
          await AdminQA.api("/login", {
            method: "POST",
            body: JSON.stringify({ password: document.getElementById("password-input").value }),
          });
          location.href = "/admin/dashboard";
        } catch (e) {
          errorEl.textContent = e.message;
          errorEl.hidden = false;
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
